name: Deploy Backend

on:
  push:
    branches: [main]
    paths: ['backend/**']
  workflow_dispatch:

env:
  IMAGE: ${{ secrets.ACR_LOGIN_SERVER }}/nablon-careers-backend
  RG: ${{ secrets.AZURE_RESOURCE_GROUP }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
          password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update Container Apps
        run: |
          for app in careers-backend careers-celery-worker careers-celery-beat; do
            echo "Deploying $app..."
            az containerapp update \
              --name "$app" \
              --resource-group "${{ env.RG }}" \
              --image "${{ env.IMAGE }}:${{ github.sha }}"
          done

      - name: Run database migrations
        run: |
          set -o pipefail
          az extension add --name containerapp --upgrade --only-show-errors

          echo "Waiting for a running careers-backend replica on the new revision..."
          for i in $(seq 1 15); do
            STATE=$(az containerapp replica list \
              --name careers-backend \
              --resource-group "${{ env.RG }}" \
              --query "[0].properties.runningState" -o tsv 2>/dev/null || true)
            if [ "$STATE" = "Running" ]; then
              echo "Replica is running."
              break
            fi
            echo "  replica state: ${STATE:-<none yet>} (attempt $i/15) — waiting 10s"
            sleep 10
          done

          # az containerapp exec always tries to put the local terminal into
          # raw mode (Python's tty.setcbreak on stdin), which hard-crashes
          # with "Inappropriate ioctl for device" when there's no real TTY —
          # which a GitHub Actions runner never has. `script` allocates a
          # pseudo-terminal for the child process so that call succeeds.
          # (See .github/scripts/run_migration.sh for the actual command.)
          echo "Running alembic upgrade head on careers-backend (via a fake tty)..."
          OUTPUT=$(timeout 180 script -qec "sh $GITHUB_WORKSPACE/.github/scripts/run_migration.sh" /dev/null 2>&1) || true
          echo "$OUTPUT"

          # backend/scripts/ci_migrate.sh runs with `set -e` and only ever
          # prints MIGRATION_OK as its last line, and only if `alembic
          # upgrade head` itself exited 0 — so its absence means the upgrade
          # failed (or the exec session itself never got that far).
          if ! echo "$OUTPUT" | grep -q "MIGRATION_OK"; then
            echo "::error::Could not confirm the migration completed (no MIGRATION_OK marker seen) — see output above. Verify and, if needed, run it manually: az containerapp exec -n careers-backend -g $RG --command \"sh /app/scripts/ci_migrate.sh\""
            exit 1
          fi
          echo "Migrations applied successfully."
